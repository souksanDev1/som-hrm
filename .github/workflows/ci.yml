name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hrm:hrm@localhost:5432/hrm_test?schema=public
      E2E_DATABASE_URL: postgresql://hrm:hrm@localhost:5432/hrm_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create non-superuser app role (required for row-level security)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE hrm LOGIN PASSWORD 'hrm' NOSUPERUSER CREATEDB NOBYPASSRLS"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE hrm_test OWNER hrm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @hrm/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: hrm-web/playwright-report
