appId: la.som.hrm
name: Temporary PIN from HR must be changed before using the app, even after a restart
---
- runScript: ../scripts/issue-temp-pin.js
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: "tab-pin"
- tapOn:
    id: "input-workspace"
- inputText: "som-demo"
- tapOn:
    id: "input-identifier"
- inputText: ${output.employeeCode}
- hideKeyboard
- tapOn:
    id: "input-pin"
- inputText: ${output.tempPin}
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "change-pin-screen"
- assertVisible:
    id: "forced-change-intro"
# Restarting the app must not skip the forced change (gate re-checked from /auth/me).
- stopApp
- launchApp
- assertVisible:
    id: "change-pin-screen"
- tapOn:
    id: "input-current-pin"
- inputText: ${output.tempPin}
- hideKeyboard
- tapOn:
    id: "input-new-pin"
- inputText: "730261"
- hideKeyboard
- tapOn:
    id: "change-pin-submit"
- assertVisible:
    id: "home-screen"
- stopApp
- launchApp
- assertVisible:
    id: "home-screen"
