appId: la.som.hrm
name: HR signs in with password, browses the org structure and signs out
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: "tab-password"
- tapOn:
    id: "input-workspace"
- inputText: "som-demo"
- hideKeyboard
- tapOn:
    id: "input-identifier"
- inputText: "admin@som.la"
- hideKeyboard
- tapOn:
    id: "input-password"
- inputText: "Admin1234"
- hideKeyboard
- tapOn:
    id: "input-password-toggle"
- assertVisible: "Admin1234"
- tapOn:
    id: "input-password-toggle"
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "open-org"
# Rows carry accessibility labels ("name, head, count"), so match by prefix.
- assertVisible: "ປະທານ.*"
- assertVisible: "CEO.*"
# HR (two levels down) is listed collapsed with its head; tapping it shows the staff, head badged.
- tapOn: "ບຸກຄະລາກອນ \\(HR\\).*"
- assertVisible: "ສົມສັກ ພົມມະວົງ, .*ຫົວໜ້າ"
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "logout"
- tapOn:
    id: "logout"
- assertVisible:
    id: "login-screen"
