appId: la.som.hrm
name: Forgot PIN request shows the generic SMS confirmation
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: "forgot-link"
- assertVisible:
    id: "forgot-screen"
- tapOn:
    id: "forgot-workspace"
- inputText: "som-demo"
- tapOn:
    id: "forgot-identifier"
- inputText: "E003"
- hideKeyboard
- tapOn:
    id: "forgot-send"
- assertVisible:
    id: "forgot-sent"
- tapOn:
    id: "back-to-login"
- assertVisible:
    id: "login-screen"
